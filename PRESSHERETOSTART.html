    /* ============================================================
       CINEMATIC STARTUP SEQUENCE
       ============================================================ */
    html.preload.js body { overflow: hidden; }
    html.preload.js .hub-container,
    html.preload.js .top-controls { opacity: 0; }

    /* Matrix rain eases in rather than snapping on */
    #matrix-canvas { opacity: 0; }
    body.booted #matrix-canvas { animation: canvasIn 2s ease-out 0.1s both; }
    @keyframes canvasIn {
        from { opacity: 0; transform: scale(1.06); filter: blur(6px); }
        to   { opacity: 0.25; transform: scale(1); filter: blur(0); }
    }

    /* Sweeping light sheen that crosses the panel as it appears */
    body.booted .hub-container::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -60%;
        width: 45%;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,.14) 40%, rgba(0,255,136,.22) 50%, rgba(255,255,255,.08) 60%, transparent);
        transform: skewX(-18deg);
        animation: sheenSweep 1.5s cubic-bezier(.16, 1, .3, 1) 1.05s both;
    }
    @keyframes sheenSweep {
        0%   { left: -60%; opacity: 0; }
        12%  { opacity: 1; }
        100% { left: 130%; opacity: 0; }
    }

    /* Main panel: rise from depth + de-blur */
    body.booted .hub-container {
        animation: panelIn 1.1s cubic-bezier(.16, 1, .3, 1) 0.05s both;
    }
    @keyframes panelIn {
        0%   { opacity: 0; transform: perspective(1200px) translateY(52px) scale(.92) rotateX(6deg); filter: blur(16px); }
        55%  { opacity: 1; }
        100% { opacity: 1; transform: perspective(1200px) translateY(0) scale(1) rotateX(0deg); filter: blur(0); }
    }

    /* Top controls drift down from above */
    body.booted .top-controls {
        animation: dropIn .85s cubic-bezier(.16, 1, .3, 1) 0.42s both;
    }
    @keyframes dropIn {
        0%   { opacity: 0; transform: translateY(-26px); filter: blur(8px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* Staggered menu choreography — uses translate (not transform) so hover
       scale effects keep working after the animation settles */
    body.booted .menu-options > *,
    body.booted .menu-options .minecraft-grid > * {
        opacity: 0;
        animation: itemIn .72s cubic-bezier(.16, 1, .3, 1) both;
    }
    @keyframes itemIn {
        0%   { opacity: 0; translate: 0 22px; filter: blur(7px); }
        100% { opacity: 1; translate: 0 0; filter: blur(0); }
    }

    /* ---- Boot overlay ---- */
    #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #06100b 0%, #000 74%);
        font-family: 'Courier New', Courier, monospace;
        color: var(--neon-green);
        overflow: hidden;
        cursor: pointer;
        transition: opacity .6s cubic-bezier(.4, 0, .2, 1),
                    transform .6s cubic-bezier(.4, 0, .2, 1),
                    filter .6s cubic-bezier(.4, 0, .2, 1);
    }
    #boot-screen::after {   /* subtle vignette + grain */
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.7) 100%);
    }
    #boot-screen.exit {
        opacity: 0;
        transform: scale(1.12);
        filter: blur(12px) brightness(2.4);
        pointer-events: none;
    }

    #boot-screen .scan {
        position: absolute;
        left: 0; right: 0;
        height: 170px;
        z-index: 1;
        background: linear-gradient(rgba(0,255,136,0), rgba(0,255,136,.10), rgba(0,255,136,0));
        animation: scanSweep 2.6s linear infinite;
        pointer-events: none;
    }
    @keyframes scanSweep { 0% { top: -170px; } 100% { top: 100%; } }

    #boot-inner {
        position: relative;
        z-index: 2;
        width: min(960px, 94vw);
        animation: bootFloat 6s ease-in-out infinite;
    }
    @keyframes bootFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-5px); }
    }
    #boot-head {
        font-size: clamp(10px, 1.3vw, 13px);
        letter-spacing: 3px;
        opacity: .7;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(0,255,136,.25);
    }
    #boot-head .dot {
        display: inline-block;
        width: 7px; height: 7px;

        background: var(--neon-green);
        box-shadow: 0 0 10px var(--neon-green);
        margin-right: 8px;
        animation: pulseDot 1.2s ease-in-out infinite;
    }
    @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

    #boot-log {
        margin: 0 0 14px;
        height: min(60vh, 470px);
        overflow: hidden;
        font-size: clamp(10px, 1.12vw, 13.5px);
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        text-shadow: 0 0 7px rgba(0,255,136,.42);
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 7%, #000 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 7%, #000 100%);
    }
    #boot-log .bl { animation: lineIn .16s ease-out both; }
    @keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }
    #boot-log .ok   { color: #a7ffd4; text-shadow: 0 0 9px rgba(0,255,136,.9); }
    #boot-log .fail { color: #ff6b6b; text-shadow: 0 0 9px rgba(255,60,60,.9); }
    #boot-log .warn { color: #ffcf5f; text-shadow: 0 0 9px rgba(255,200,90,.6); }
    #boot-log .ts   { color: #3f9d6f; }
    #boot-log .cy   { color: #6fe3ff; }
    #boot-log .arch {
        color: #7fe9ff;
        text-shadow: 0 0 10px rgba(111,227,255,.85), 0 0 22px rgba(0,180,255,.5);
    }
    #boot-log .dim  { opacity: .45; }

    #boot-progress {
        width: 100%;
        height: 8px;
        border: 1px solid var(--neon-green);
        border-radius: 5px;
        overflow: hidden;
        box-shadow: inset 0 0 12px rgba(0,255,136,.25);
    }
    #boot-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--neon-green), #d8fff0);
        box-shadow: 0 0 18px var(--neon-green);
        transition: width .3s cubic-bezier(.16, 1, .3, 1);
    }
    #boot-status {
        margin-top: 10px;
        text-align: right;
        font-size: clamp(10px, 1.3vw, 13px);
        letter-spacing: 2px;
        opacity: .8;
    }

    /* White CRT power-on flash */
    #crt-flash {
        position: fixed;
        inset: 0;
        z-index: 100000;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        animation: crtFlash .55s ease-out forwards;
    }
    @keyframes crtFlash {
        0%   { opacity: 0; }
        6%   { opacity: .85; }
        100% { opacity: 0; }
    }

    /* Title glitch while scrambling into place */
    .title-glitch { animation: titleShake .18s steps(2) infinite; }
    @keyframes titleShake {
        0%   { transform: translate(0, 0);       text-shadow: 2px 0 #ff2d6f, -2px 0 #00d2ff, 0 0 15px rgba(0,255,136,.5); }
        50%  { transform: translate(-1px, 1px);  text-shadow: -2px 0 #ff2d6f, 2px 0 #00d2ff, 0 0 15px rgba(0,255,136,.5); }
        100% { transform: translate(1px, -1px);  text-shadow: 2px 0 #ff2d6f, -2px 0 #00d2ff, 0 0 15px rgba(0,255,136,.5); }
    }

    /* Reduced motion: still play the boot, but drop the perpetual loops */
    @media (prefers-reduced-motion: reduce) {
        #boot-screen .scan { animation: none; opacity: .35; }
        #boot-inner { animation: none; }
        #boot-head .dot { animation: none; }
        #crt-flash { animation: none; opacity: 0; }
        body.booted #matrix-canvas { animation: none; opacity: .25; }
        body.booted .hub-container { animation: none; opacity: 1; }
        body.booted .top-controls { animation: none; opacity: 1; }
        body.booted .menu-options > *,
        body.booted .menu-options .minecraft-grid > * { animation: none; opacity: 1; translate: 0 0; }
        body.booted .hub-container::before { animation: none; opacity: 0; }
    }
</style>

<script>
// THEME SYNC (cross-page)
try {
    const t = JSON.parse(localStorage.getItem('arcade_custom_theme') || 'null');
    const r = document.documentElement.style;
    if (t && t.color) {
        r.setProperty('--neon-green', t.color);
        if (t.bg) r.setProperty('--dark-bg', t.bg);
        if (t.accent) r.setProperty('--accent', t.accent);
    } else {
        const c = localStorage.getItem('arcade_custom_color');
        if (c) r.setProperty('--neon-green', c);
    }
} catch (e) {}

// --- AUDIO SYSTEM (WEB AUDIO API & HACKER AMBIENT ENGINE) ---
let audioCtx = null;
let ambientRunning = false;
let ambientInterval = null;
let droneOsc = null;
let droneGain = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playHoverSound() {
    try {
        initAudio();
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    } catch(e) {}
}

function playClickSound() {
    try {
        initAudio();
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

// Procedural Cryptic Hacker Ambient Generator
function toggleAmbientMusic() {
    initAudio();
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const btn = document.getElementById('ambient-toggle');
    if (!ambientRunning) {
        ambientRunning = true;
        btn.innerText = "🔊 HACKER AMBIENT: ON";

        // Low pulsing drone
        droneOsc = audioCtx.createOscillator();
        droneGain = audioCtx.createGain();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime);

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(180, audioCtx.currentTime);

        droneGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

        droneOsc.connect(filter);
        filter.connect(droneGain);
        droneGain.connect(audioCtx.destination);
        droneOsc.start();

        // Data stream bleep loop
        const notes = [220, 246.94, 277.18, 329.63, 392, 440, 523.25, 659.25];
        ambientInterval = setInterval(() => {
            if (!ambientRunning) return;
            try {
                const bleep = audioCtx.createOscillator();
                const bleepGain = audioCtx.createGain();
                bleep.type = Math.random() > 0.5 ? 'sine' : 'square';
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                bleep.frequency.setValueAtTime(randomNote * 2, audioCtx.currentTime);
                
                bleepGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                bleepGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

                bleep.connect(bleepGain);
                bleepGain.connect(audioCtx.destination);
                bleep.start();
                bleep.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }, 300);

    } else {
        ambientRunning = false;
        btn.innerText = "🔊 HACKER AMBIENT: OFF";
        if (droneOsc) {
            try { droneOsc.stop(); droneOsc.disconnect(); } catch(e) {}
            droneOsc = null;
        }
        if (ambientInterval) {
            clearInterval(ambientInterval);
            ambientInterval = null;
        }
    }
}

// --- MATRIX RAIN ---
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array.from({length: columns}, () => 1);

function drawMatrix() {
    ctx.fillStyle = matrixBg;
    ctx.globalAlpha = 0.08;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
    
    ctx.fillStyle = matrixColor;
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 30);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

  var __swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (__swReloaded) return;
    __swReloaded = true;
    window.location.reload();
  });
}

    var idx = 0, timer = null;
    var spin = ['\u280B', '\u2819', '\u2839', '\u2838', '\u283C', '\u2834', '\u2826', '\u2827', '\u2807', '\u280F'];
    function statusFor(pct) {
        return spin[(Date.now() >> 6) % spin.length] + '  booting \u2022 ' + pct + '%';
    }
    function appendLine(item) {
        var div = document.createElement('div');
        div.className = 'bl';
        div.innerHTML = item.html;
        logEl.appendChild(div);
    }
    function done() {
        statusEl.textContent = '\u2714  system ready';
        barEl.style.width = '100%';
        setTimeout(exitBoot, skipRequested ? 200 : 950);
    }
    function step() {
        if (idx >= SEQ.length) { done(); return; }
        if (skipRequested) {
            while (idx < SEQ.length) { appendLine(SEQ[idx]); idx++; }
            logEl.scrollTop = logEl.scrollHeight;
            done();
            return;
        }
        appendLine(SEQ[idx]);
        idx++;
        var pct = Math.round(idx / SEQ.length * 100);
        barEl.style.width = pct + '%';
        statusEl.textContent = statusFor(pct);
        timer = setTimeout(step, SEQ[idx - 1].d);
    }

    // Smoothly auto-follow the newest line (lerped scroll)
    function follow() {
        if (!scrollRunning) return;
        var target = logEl.scrollHeight - logEl.clientHeight;
        if (target < 0) target = 0;
        var cur = logEl.scrollTop;
        if (target - cur > 0.5) logEl.scrollTop = cur + (target - cur) * 0.22;
        requestAnimationFrame(follow);
    }

    function requestSkip() {
        if (finished || skipRequested) return;
        skipRequested = true;
        if (timer) { clearTimeout(timer); timer = null; }
        step();
    }
    bootEl.addEventListener('click', requestSkip);
    document.addEventListener('keydown', function (e) {
        if (!finished && (e.key === 'Escape' || e.key === ' ' || e.key === 'Enter')) {
            e.preventDefault();
            requestSkip();
        }
    });

    requestAnimationFrame(follow);
    timer = setTimeout(step, 240);
})();
