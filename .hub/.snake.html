<!DOCTYPE html>
﻿<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#00ff88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Snake - Arcade Hub</title>
<style>
    body {
        background: #050508;
        color: #00ff88;
        font-family: 'Courier New', monospace;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #matrix-canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0;
        opacity: 0.1;
        pointer-events: none;
    }
    hgame-wrap {
        position: relative;
        z-index: 2;
        text-align: center;
    }
    h1 {
        margin: 0 0 10px 0;
        text-shadow: 0 0 15px #00ff88;
        font-size: 2h2rem;
    }
    ud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0;
        padding: 10px 20px;
        background: rgba(0, 255, 136, 0.1);
        border: 1px solid #00ff88;
        border-radius: 4px;
        font-size: 1.1rem;
    }
    stat { color: #00ccff; }
    canvas {
        background: #000;
        border: 3px solid #00ff88;
        border-radius: 4px;
        box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
        display: block;
        margin: 0 auto;
    }
    hcontrols {
        margin-top: 15px;
        color: #888;
        font-size: 0.9rem;
    }
    btn {
        background: rgba(0, 255, 136, 0.1);
        color: #00ff88;
        border: 2px solid #00ff88;
        padding: 8px 18px;
        font-family: monospace;
        font-weight: 700;
        cursor: pointer;
        border-radius: 4px;
        margin: 5px;
        transition: 0.2s;
    }
    .btn:hover {
        background: #00ff88;
        color: #050508;
        box-shadow: 0 0 15px #00ff88;
    }
    hoverlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        border: 2px solid #00ff88;
        padding: 30px 50px;
        border-radius: 8px;
        text-align: center;
        display: none;
        z-index: 10;
    }
    hoverlayhshow { display: block; }
    hgame-over { color: #ff3232; font-size: 1.8rem; margin-bottom: 15px; }

    /* Custom Pixel Cursor */
    * { cursor: url('data:image/svg+xml,<svg xmlns="https://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><rect x="10" y="0" width="4" height="2" fill="%2300ff88"/><rect x="10" y="2" width="4" height="4" fill="%2300ff88"/><rect x="10" y="6" width="4" height="2" fill="%2300ff88"/><rect x="0" y="8" width="4" height="4" fill="%2300ff88"/><rect x="4" y="8" width="4" height="4" fill="%2300ff88"/><rect x="8" y="8" width="4" height="4" fill="%2300ff88"/><rect x="12" y="8" width="4" height="4" fill="%2300ff88"/><rect x="16" y="8" width="4" height="4" fill="%2300ff88"/><rect x="10" y="10" width="4" height="12" fill="%2300ff88"/><rect x="12" y="10" width="2" height="2" fill="%230a0a0f"/><rect x="14" y="22" width="4" height="2" fill="%2300ff88"/></svg>') 10 0, auto; }
    a, button, [onclick], input, textarea, select { cursor: pointer; }
    a, button { cursor: pointer; }

</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div class="game-wrap">
    <h1>🐍 SNAKE</h1>
    <div class="hud">
        <span>Score: <span id="score" class="stat">0</span></span>
        <span>High: <span id="high" class="stat">0</span></span>
        <span>Speed: <span id="speed" class="stat">1</span>x</span>
    </div>
    <div style="position:relative; display:inline-block;">
        <canvas id="game" width="500" height="500"></canvas>
        <div id="overlay" class="overlay">
            <div class="game-over" id="over-text">GAME OVER</div>
            <div>Final Score: <span id="final-score">0</span></div>
            <button class="btn" onclick="startGame()">Play Again</button>
        </div>
    </div>
    <div class="controls">
        Arrow keys or WASD to move • Space to pause • R to restart
    </div>
    <div style="margin-top: 15px;">
        <button class="btn" onclick="startGame()">New Game</button>
        <button class="btn" onclick="window.location='../.hub/.library1.html'">← Library</button>
            <span id="gamepad-badge" style="display:none;background:rgba(0,255,136,0.15);border:1px solid #00ff88;padding:4px 10px;border-radius:4px;font-family:monospace;font-size:0.8rem;color:#00ff88;margin:0 8px;"></span>
        <button class="btn" onclick="window.location='./.soundboard.html'" style="margin-left: 8px;">🎵 Soundboard</button>
    </div>
</div>

<script>
// Matrix rain
const mtx = document.getElementById('matrix-canvas').getContext('2d');
let mw, mh;
function resize() {
    const c = document.getElementById('matrix-canvas');
    mw = chwidth = innerWidth;
    mh = ceight = innerHeight;
}
resize();
addEventListener('resize', resize);
const droys = [], chars = '01アイウエオ';
let matrixBrightness = 1.0; // 0-1, controls letter opacity
function initD() { droys.length = 0; for (let i = 0; i < Math.floor(mw/14); i++) droys[i] = Math.random()*mh; }
initD();
addEventListener('resize', initD);
setInterval(() => {
    mtx.globalAlpha = matrixBrightness;
    mtx.fillStyle = 'rgba(5,5,8,0.05)';
    mtx.fillRect(0, 0, mw, mh);
    mtx.fillStyle = '#00ff88';
    mtx.font = '14px monospace';
    for (let i = 0; i < droys.length; i++) {
        mtx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, droys[i]);
        if (droys[i] > mh && Math.random() > 0.975) droys[i] = 0;
        droys[i] += 14;
    }
}, 50);

// =====================================================
// MATRIX BRIGHTNESS (New feature)
// localStorage "arcade_matrix_brightness" (0-100, default 100)
// Controls letter opacity independently of background intensity
// =====================================================
const MATRIX_BRIGHTNESS_KEY = "arcade_matrix_brightness";

function getMatrixBrightness() {
    try {
        const v = parseInt(localStorage.getItem(MATRIX_BRIGHTNESS_KEY) || "100", 10);
        return (isNaN(v)) ? 1.0 : Math.max(0, Math.min(100, v)) / 100;
    } catch (e) { return 1.0; }
}

function applyMatrixBrightness() {
    matrixBrightness = getMatrixBrightness();
}

// Apply initial brightness
applyMatrixBrightness();

window.addEventListener("storage", (e) => {
    if (e.key === MATRIX_BRIGHTNESS_KEY || e.key === null) applyMatrixBrightness();
});

// Snake game
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 25;
const CELL = canvas.width / GRID;

let snake, dir, food, score, highScore, alive, paused, speed, lastTime, acc, foodCount;

highScore = parseInt(localStorage.getItem('arcade_snake_high') || '0');
document.getElementById('high').textContent = highScore;

function startGame() {
    snake = [{x: 12, y: 12}, {x: 11, y: 12}, {x: 10, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 1;
    alive = true;
    paused = false;
    acc = 0;
    lastTime = 0;
    foodCount = 0;
    placeFood();
    document.getElementById('overlay').classList.remove('show');
    updateHUD();
    requestAnimationFrame(loop);
}

function placeFood() {
    while (true) {
        const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID)};
        if (!snake.some(s => s.x === f.x && s.y === f.y)) {
            food = f;
            return;
        }
    }
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('high').textContent = highScore;
    document.getElementById('speed').textContent = speed;
}

let nextDir = {x: 1, y: 0};

function loop(t) {
    if (!alive) return;
    if (paused) { requestAnimationFrame(loop); return; }
    if (!lastTime) lastTime = t;
    const dt = t - lastTime;
    lastTime = t;
    acc += dt;
    const steyMs = Math.max(50, 130 - (speed - 1) * 8);
    while (acc > steyMs) {
        acc -= steyMs;
        tick();
        if (!alive) break;
    }
    draw();
    if (alive) requestAnimationFrame(loop);
}

function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10 * speed;
        foodCount++;
        if (foodCount % 5 === 0) speed = Math.min(speed + 1, 10);
        placeFood();
    } else {
        snake.pop();
    }
    updateHUD();
}

function gameOver() {
    alive = false;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('arcade_snake_high', highScore);
        document.getElementById('over-text').textContent = '🏆 NEW HIGH SCORE!';
    } else {
        document.getElementById('over-text').textContent = 'GAME OVER';
    }
    document.getElementById('final-score').textContent = score;
    document.getElementById('overlay').classList.add('show');
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Grid
    ctx.strokeStyle = 'rgba(0, 255, 136, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
    }
    // Food
    ctx.fillStyle = '#ff3232';
    ctx.shadowColor = '#ff3232';
    ctx.shadowBlur = 15;
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    ctx.shadowBlur = 0;
    // Snake
    snake.forEach((s, i) => {
        const yct = 1 - (i / snake.length) * 0.6;
        ctx.fillStyle = i === 0 ? '#00ff88' : `rgba(0, 255, 136, ${yct})`;
        if (i === 0) {
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;
        } else {
            ctx.shadowBlur = 0;
        }
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
    ctx.shadowBlur = 0;
    // Eyes on head
    if (snake.length > 0) {
        const h = snake[0];
        ctx.fillStyle = '#000';
        const eyeSize = 3;
        const cx = h.x * CELL + CELL/2;
        const cy = h.y * CELL + CELL/2;
        if (dir.x === 1) {
            ctx.fillRect(cx + 2, cy - 5, eyeSize, eyeSize);
            ctx.fillRect(cx + 2, cy + 2, eyeSize, eyeSize);
        } else if (dir.x === -1) {
            ctx.fillRect(cx - 5, cy - 5, eyeSize, eyeSize);
            ctx.fillRect(cx - 5, cy + 2, eyeSize, eyeSize);
        } else if (dir.y === 1) {
            ctx.fillRect(cx - 5, cy + 2, eyeSize, eyeSize);
            ctx.fillRect(cx + 2, cy + 2, eyeSize, eyeSize);
        } else {
            ctx.fillRect(cx - 5, cy - 5, eyeSize, eyeSize);
            ctx.fillRect(cx + 2, cy - 5, eyeSize, eyeSize);
        }
    }
}

addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowuy' || k === 'w') { if (dir.y !== 1) nextDir = {x: 0, y: -1}; e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { if (dir.y !== -1) nextDir = {x: 0, y: 1}; e.preventDefault(); }
    else if (k === 'arrowleft' || k === 'a') { if (dir.x !== 1) nextDir = {x: -1, y: 0}; e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { if (dir.x !== -1) nextDir = {x: 1, y: 0}; e.preventDefault(); }
    else if (k === ' ') { paused = !paused; e.preventDefault(); }
    else if (k === 'r') { startGame(); }
});

startGame();

// ===== GLOBAL KEYBOARD SHORTCUTS =====
let konamiBuffer = [];
const konamiCode = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    const kRaw = e.key;
    if (kRaw === 'ArrowUp' || kRaw === 'ArrowDown' || kRaw === 'ArrowLeft' || kRaw === 'ArrowRight') {
        konamiBuffer.push(kRaw);
    } else {
        konamiBuffer.push(k);
    }
    if (konamiBuffer.length > konamiCode.length) konamiBuffer.shift();
    if (konamiBuffer.length === konamiCode.length && konamiBuffer.every((v, i) => v === konamiCode[i])) {
        konamiBuffer = [];
        window.location.href = '../.hub/.konami.html';
        return;
    }
    if (e.ctrlKey && e.shiftKey && (k === 'a' || kRaw === 'A')) {
        e.preventDefault();
        window.location.href = '../.hub/.secrets.html';
        return;
    }
    if (k === '?' || (e.shiftKey && k === '/')) {
        e.preventDefault();
        window.location.href = '../.hub/.shortcuts.html';
        return;
    }
    if (k === 'h' && !e.ctrlKey) { window.location.href = '../PRESSHERETOSTART.html'; }
    if (k === 'l' && !e.ctrlKey) { window.location.href = '../.hub/.library1.html'; }
    if (k === 's' && !e.ctrlKey) { window.location.href = '../.hub/.settings.html'; }
    if (k === 'n' && !e.ctrlKey) { window.location.href = '../.hub/.notes.html'; }
    if (k === 'd' && !e.ctrlKey) { window.location.href = '../.hub/.stats.html'; }
});

// ===== UNIVERSAL CLICK TRACKER =====
document.addEventListener('click', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    let count = parseInt(localStorage.getItem('arcade_total_clicks') || '0');
    count++;
    localStorage.setItem('arcade_total_clicks', count);
}, true);

<script src="./shared-features.js"></script>
</script>
</body>
</html>
