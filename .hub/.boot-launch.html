<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launching…</title>
<style>
  :root { --neon-green: #00ff88; --dark-bg: #000; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--dark-bg); overflow: hidden; }
</style>
</head>
<body>
<script>
/* boot-launch.html — plays the ~2s Arcade boot, then opens the requested game.
   Usage:  .hub/.boot-launch.html?g=<filename-with-extension>
   No query -> returns to the library. Never traps the user: has a hard fallback. */
(function () {
  var GAMES = '../.games/pack/offline/';
  var g = '';
  try {
    var qs = new URLSearchParams(window.location.search);
    g = qs.get('g') || '';
  } catch (e) {
    // very old browser: parse manually
    var m = /[?&]g=([^&]+)/.exec(window.location.search || '');
    if (m) { try { g = decodeURIComponent(m[1]); } catch (_) { g = m[1]; } }
  }

  // Accept only a bare filename. Reject anything containing a path separator
  // or ".." (defense in depth — the target dir is fixed anyway).
  var raw = String(g);
  if (!raw || /[\\/]/.test(raw) || raw.indexOf('..') !== -1 || !/^[A-Za-z0-9._-]+$/.test(raw)) {
    window.location.replace('./.library.html');
    return;
  }
  g = raw;

  var done = false;
  function go() {
    if (done) return;
    done = true;
    window.location.replace(GAMES + g);
  }

  // Called by .boot-transition.js when the animation ends (or the user skips it).
  window.__bootTransitionDone = go;
  // Hard fallback in case the module is missing or blocked.
  setTimeout(go, 2600);
})();
</script>
<script src="./.boot-transition.js"></script>
</body>
</html>
