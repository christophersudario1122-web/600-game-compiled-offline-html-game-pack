<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../.manifest.json">
<meta name="theme-color" content="#00ff88">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Terminal_Arcade_Pro</title>
<style>
    :root {
        --neon-green: #00ff88;
        --dark-bg: #050508;
        --box-bg: rgba(10, 10, 15, 0.85);
    }

    body {
        background: var(--dark-bg);
        color: var(--neon-green);
        font-family: 'Courier New', Courier, monospace;
        padding: 30px;
        margin: 0;
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        transition: background 0.3s, color 0.3s;
    }

    #matrix-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.25;
        pointer-events: none;
    }

    .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 10;
        pointer-events: none;
    }

    .header-container {
        position: relative;
        z-index: 2;
        max-width: 1300px;
        margin: 0 auto 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .top-controls {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .left-controls {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .back-hub-btn, .audio-toggle-btn {
        background: rgba(0, 255, 136, 0.1);
        color: var(--neon-green);
        border: 2px solid var(--neon-green);
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 700;
        font-family: monospace;
        font-size: 0.9rem;
        text-decoration: none;
        box-shadow: 0 0 10px rgba(0,255,136,0.2);
        transition: 0.2s;
    }

    .back-hub-btn:hover, .audio-toggle-btn:hover {
        background: var(--neon-green);
        color: var(--dark-bg);
        box-shadow: 0 0 20px var(--neon-green);
        transform: scale(1.05);
    }

    .theme-selector {
        background: var(--box-bg);
        border: 2px solid var(--neon-green);
        color: var(--neon-green);
        padding: 8px 14px;
        border-radius: 4px;
        font-family: monospace;
        font-weight: bold;
        cursor: pointer;
        outline: none;
        box-shadow: 0 0 10px rgba(0,255,136,0.1);
    }

    .theme-selector option {
        background: #0a0a0f;
        color: var(--neon-green);
    }

    h1 {
        text-align: center;

        letter-spacing: 3px;

    .counter {
        text-align: center;
        color: var(--neon-green);
        opacity: 0.7;
        margin-bottom: 20px;
        font-size: 1.1rem;

    }

    .action-bar {
        max-width: 700px;
        margin: 0 auto 25px;
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 0 10px;

        display: flex;

    .search-input {

        padding: 0 20px;

    .grid {

    .card {

    .fav-btn {

    .icon {

    .card:hover .icon {

    .gotd-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 25px var(--neon-green);
    }

</style>

<script>
// --- AUDIO SYSTEM (WEB AUDIO API & HACKER AMBIENT ENGINE) ---
let audioCtx = null;
let masterGain = null;
let ambientRunning = false;
let ambientInterval = null;
let droneOsc = null;
let droneGain = null;

function isMasterMuted() {
    try { return window._masterMuted === true || localStorage.getItem('arcade_master_mute') === 'on'; } catch (e) { return false; }
}

function updateMasterGain() {
    try {
        if (audioCtx && masterGain) masterGain.gain.setValueAtTime(isMasterMuted() ? 0 : 1, audioCtx.currentTime);
    } catch (e) {}
}

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(isMasterMuted() ? 0 : 1, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
    }
}

function playHoverSound() {
    try {
        initAudio();
        if(!audioCtx || isMasterMuted()) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(masterGain || audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    } catch(e) {}
}

function playClickSound() {
    try {
        initAudio();
        if(!audioCtx || isMasterMuted()) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(masterGain || audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

// Procedural Cryptic Hacker Ambient Generator
function toggleAmbientMusic() {
    initAudio();
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (isMasterMuted()) {
        if (ambientRunning) {
            ambientRunning = false;
            const mbtn = document.getElementById('ambient-toggle');
            if (mbtn) mbtn.innerText = "🔊 HACKER AMBIENT: OFF";
            if (droneOsc) { try { droneOsc.stop(); droneOsc.disconnect(); } catch(e) {} droneOsc = null; }
            if (ambientInterval) { clearInterval(ambientInterval); ambientInterval = null; }
        }
        return;
    }

    const btn = document.getElementById('ambient-toggle');
    if (!ambientRunning) {
        ambientRunning = true;
        btn.innerText = "🔊 HACKER AMBIENT: ON";

        // 1. Dark low pulsing drone (cyberpunk base chord)
        droneOsc = audioCtx.createOscillator();
        droneGain = audioCtx.createGain();
        droneOsc.type = 'sawtooth';
        droneOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low A note

        // Filter to make it a deep sci-fi rumble
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(180, audioCtx.currentTime);

        droneGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

        droneOsc.connect(filter);
        filter.connect(droneGain);
        droneGain.connect(masterGain || audioCtx.destination);
        droneOsc.start();

        // 2. Cryptic data-stream bleep loop (cyberpunk melody blips)
        const notes = [220, 246.94, 277.18, 329.63, 392, 440, 523.25, 659.25]; // Minor scale notes
        ambientInterval = setInterval(() => {
            if (!ambientRunning) return;
            try {
                const bleep = audioCtx.createOscillator();
                const bleepGain = audioCtx.createGain();
                bleep.type = Math.random() > 0.5 ? 'sine' : 'square';
                const randomNote = notes[Math.floor(Math.random() * notes.length)];
                bleep.frequency.setValueAtTime(randomNote * 2, audioCtx.currentTime);
                
                bleepGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
                bleepGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

                bleep.connect(bleepGain);
                bleepGain.connect(masterGain || audioCtx.destination);
                bleep.start();
                bleep.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }, 300);

    } else {
        ambientRunning = false;
        btn.innerText = "🔊 HACKER AMBIENT: OFF";
        if (droneOsc) {
            try { droneOsc.stop(); droneOsc.disconnect(); } catch(e) {}
            droneOsc = null;
        }
        if (ambientInterval) {
            clearInterval(ambientInterval);
            ambientInterval = null;
        }
    }
}

// --- THEME SYSTEM ---
const themes = {
    matrix: { green: "#00ff88", bg: "#050508" },
    amber: { green: "#ffb700", bg: "#0c0802" },
    blue: { green: "#00d2ff", bg: "#02060c" },
    red: { green: "#ff3333", bg: "#0c0202" }
};

let matrixColor = "#00ff88";
let matrixBg = "#050508";
let matrixBrightness = 1.0; // 0-1, controls letter opacity

function changeTheme(themeName) {
    const t = themes[themeName] || themes.matrix;
    let green = t.green, bg = t.bg, accent = t.accent || t.green;
    if (themeName === 'custom') {
        try {
            const c = JSON.parse(localStorage.getItem('arcade_custom_theme') || 'null');
            if (c && c.color) { green = c.color; if (c.bg) bg = c.bg; if (c.accent) accent = c.accent; }
        } catch (e) {}
    }
    document.documentElement.style.setProperty('--neon-green', green);
    document.documentElement.style.setProperty('--dark-bg', bg);
    if (!document.documentElement.style.getPropertyValue('--accent')) {
        document.documentElement.style.setProperty('--accent', accent);
    } else {
        document.documentElement.style.setProperty('--accent', accent);
    }
    localStorage.setItem('arcade_theme', themeName);
    matrixColor = green;
    matrixBg = bg;
}

const savedTheme = localStorage.getItem('arcade_theme') || 'matrix';
let effectiveTheme = savedTheme;
try {
    const ct = JSON.parse(localStorage.getItem('arcade_custom_theme') || 'null');
    if (ct && ct.color) effectiveTheme = 'custom';
} catch (e) {}
document.getElementById('theme-select').value = effectiveTheme;
changeTheme(effectiveTheme);

function toggleFavorite(g, event) {
    event.preventDefault();
    event.stopPropagation();
    playClickSound();
    const index = favorites.indexOf(g);
    if (index > -1) favorites.splice(index, 1);
    else favorites.push(g);
    localStorage.setItem('arcade_favorites', JSON.stringify(favorites));
    if (typeof updateFavBadge === 'function') updateFavBadge();
    displayGames();
}

function recordRecent(g) {
    playClickSound();
    recentlyPlayed = recentlyPlayed.filter(item => item !== g);
    recentlyPlayed.unshift(g);
    if (recentlyPlayed.length > 12) recentlyPlayed.pop();
    localStorage.setItem('arcade_recent', JSON.stringify(recentlyPlayed));
    if (typeof recordPlay === 'function') recordPlay(g);
}

function getFilteredGames() {
    const searchQuery = document.getElementById("search-input").value.toLowerCase().trim();
    let baseList = games;
    if (currentFilter === "recent") {
        baseList = recentlyPlayed.filter(g => games.includes(g));
    }
    return baseList.filter(g => {
        let n = g.replace(/([0-9\.]+)/g, ' $1 ').replace(/([A-Z])/g, ' $1').replace(/_|-/g, ' ').replace(/\s+/g, ' ').trim();
        n = n.toLowerCase();
        let matchesTab = (currentFilter === "all") ? true : 
                         (currentFilter === "favorites" ? favorites.includes(g) : 
                         (currentFilter === "recent" ? true : getT(g).includes(currentFilter)));
        let matchesSearch = n.includes(searchQuery) || g.toLowerCase().includes(searchQuery);
        return matchesTab && matchesSearch;
    });
}

// ===== GAME OF THE DAY =====
function getGameOfTheDay() {
    const today = new Date().toDateString();
    const cached = localStorage.getItem('arcade_gotd');
    if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.date === today) return parsed.game;
    }
    // Pick a random game for today based on date
    const seed = today.split('').reduce((a,b) => a + b.charCodeAt(0), 0);
    const game = games[seed % games.length];
    localStorage.setItem('arcade_gotd', JSON.stringify({ date: today, game }));
    return game;
}

function updateGameOfTheDay() {
    const game = getGameOfTheDay();
    const nameEl = document.getElementById('gotd-name');
    if (nameEl) {
        // Format game name nicely
        let n = game.replace(/([0-9\.]+)/g, ' $1 ').replace(/([A-Z])/g, ' $1').replace(/_|-/g, ' ').replace(/\s+/g, ' ').trim();
        n = n.split(' ').map(w => {
            const lower = w.toLowerCase();
            if (['td','fnaf','lol','3d','2','3','4','5','6','7','8'].includes(lower)) return w.toUpperCase();
            return w.charAt(0).toUpperCase() + w.slice(1);
        }).join(' ');
        nameEl.textContent = n;
    }
    
    // Update countdown
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(tomorrow.getDate() + 1);
    tomorrow.setHours(0, 0, 0, 0);
    const diff = tomorrow - now;
    const hours = Math.floor(diff / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const countdownEl = document.getElementById('gotd-countdown');
    if (countdownEl) countdownEl.textContent = 'Resets in ' + hours + 'h ' + mins + 'm';
    renderGotdStreak();
}

function fmtTime(sec) {
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  return h + 'h ' + m + 'm';
}

function setRating(game, stars) {
  localStorage.setItem('arcade_rating_' + game, stars);
  displayGames();
}

function showRatingModal(game) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;'; 
  modal.innerHTML = `
    <div style="background:#0a0a0f;border:2px solid #00ff88;border-radius:10px;padding:30px;text-align:center;max-width:400px;">
      <h3 style="color:#00ff88;margin:0 0 10px;">Rate: ${game}</h3>
      <div id="rating-stars" style="font-size:2rem;cursor:pointer;margin:15px 0;">${'★☆☆☆☆'}</div>
      <button onclick="this.closest('[style*=\"z-index:9999\"]').remove()" style="padding:8px 20px;background:#00ff88;color:#000;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">SUBMIT</button>
    </div>`;
  document.body.appendChild(modal);
  let selected = 0;
  const starsEl = modal.querySelector('#rating-stars');
  starsEl.addEventListener('click', (e) => {
    const rect = starsEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    selected = Math.min(5, Math.max(1, Math.ceil(x / (rect.width / 5))));
    starsEl.textContent = '★'.repeat(selected) + '☆'.repeat(5 - selected);
  });
  modal.querySelector('button').onclick = () => {
    setRating(game, selected);
    modal.remove();
  };
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

function playGameOfTheDay() {
    const game = getGameOfTheDay();
    try {
        const st = getGotdStreak();
        const today = new Date().toDateString();
        if (st.days.indexOf(today) === -1) { st.days.push(today); st.last = today; }
        localStorage.setItem('arcade_gotd_streak', JSON.stringify(st));
        renderGotdStreak();
    } catch (e) {}
    const ext = HTM_GAMES.has(game) ? '.htm' : '.html';
    window.open('./.boot-launch.html?g=' + encodeURIComponent(game + ext), '_blank');
    recordRecent(game);
    recordPlay(game);
    playClickSound();
}

function getGotdStreak() {
    try { return JSON.parse(localStorage.getItem('arcade_gotd_streak') || '{"days":[]}'); }
    catch (e) { return { days: [] }; }
}

function computeGotdStreak(days) {
    const set = new Set(days || []);
    let streak = 0;
    const d = new Date();
    while (set.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
    return streak;
}

function renderGotdStreak() {
    const el = document.getElementById('gotd-streak');
    if (!el) return;
    const st = computeGotdStreak(getGotdStreak().days);
    el.textContent = st > 0 ? '🔥 GOTD streak: ' + st + ' day' + (st === 1 ? '' : 's') : 'Play the Game of the Day daily to build a streak!';
}

const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const fontSize = 16;
const columns = canvas.width / fontSize;

function drawMatrix() {
    ctx.fillStyle = matrixBg;
    ctx.globalAlpha = 0.08;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
    
    ctx.globalAlpha = matrixBrightness;
    ctx.fillStyle = matrixColor;
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}

// Lessons applied (from v1 corruption debugging):
// 1. No function re-assignment. recordRecent/displayGames are
//    function declarations; we modify them in-place or hook

// ---------- 1. STORAGE LAYER ----------
const Storage = {
    KEYS: {
        plays: 'arcade_play_counts',
        totalPlays: 'arcade_total_plays',
        tagHistory: 'arcade_tag_history',
        achievements: 'arcade_achievements',
    },
    getJSON(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key)) || fallback; }
        catch (e) { return fallback; }
    },
    setJSON(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); }
        catch (e) { /* quota exceeded - silent fail */ }
    },
};

// ---------- 2. PLAY COUNT TRACKING ----------
var playCounts = Storage.getJSON(Storage.KEYS.plays, {});

function recordPlay(gameName) {
    if (!gameName) return;
    playCounts[gameName] = (playCounts[gameName] || 0) + 1;
    totalPlays += 1;
    Storage.setJSON(Storage.KEYS.plays, playCounts);
    try { localStorage.setItem(Storage.KEYS.totalPlays, String(totalPlays)); } catch (e) {}
    try {
        const dayKey = new Date().toISOString().slice(0, 10);
        const dayMap = Storage.getJSON('arcade_play_days', {});
        dayMap[dayKey] = (dayMap[dayKey] || 0) + 1;
        Storage.setJSON('arcade_play_days', dayMap);
    } catch (e) {}
    // Update tag history for recommendations
    const tags = (typeof getT === 'function') ? getT(gameName) : [];
    if (tags.length) {
        const hist = Storage.getJSON(Storage.KEYS.tagHistory, {});
        tags.forEach(t => { hist[t] = (hist[t] || 0) + 1; });
        Storage.setJSON(Storage.KEYS.tagHistory, hist);
    }
    // Trigger achievement check
    checkAchievements();
    // Update count display if visible
    displayGames();
    updateCountDisplay();
}

function updateCountDisplay() {

// ---------- 3. SORT (DOM reordering, no function patching) ----------
let currentSort = 'name';

function applySort() {
    const grid = document.getElementById('game-grid');
    if (!grid) return;
    const cards = Array.from(grid.children);
    if (cards.length < 2) return;
    // Build name->card map from existing DOM
    const cardMap = {};
    cards.forEach(card => {
        const href = card.getAttribute('href');
        if (!href) return;
        const name = decodeURIComponent(href.split('/').pop()).replace(/\.html?$/, '');
        cardMap[name] = card;
    });
    const order = Object.keys(cardMap);
    if (currentSort === 'name') {
        order.sort((a, b) => a.localeCompare(b));
    } else if (currentSort === 'plays') {
        order.sort((a, b) => (playCounts[b] || 0) - (playCounts[a] || 0));
    } else if (currentSort === 'recent') {
        const recent = (typeof recentlyPlayed !== 'undefined') ? recentlyPlayed : [];
        order.sort((a, b) => {
            const ai = recent.indexOf(a);
            const bi = recent.indexOf(b);
            if (ai === -1 && bi === -1) return a.localeCompare(b);
            if (ai === -1) return 1;
            if (bi === -1) return -1;
            return ai - bi;
        });
    } else if (currentSort === 'random') {
        for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
        }
    }
    // Re-append in new order (DOM reorder, not re-render)
    grid.innerHTML = '';
    order.forEach(name => { if (cardMap[name]) grid.appendChild(cardMap[name]); });
}

// ---------- 4. RECOMMENDATIONS ----------
function getRecommendations(count) {
    count = count || 8;
    const tagHistory = Storage.getJSON(Storage.KEYS.tagHistory, {});
    const scores = {};
    const allGames = (typeof games !== 'undefined') ? games : [];
    for (const g of allGames) {
        // Skip favorites (they're already known-good)
        if (typeof favorites !== 'undefined' && favorites.indexOf(g) !== -1) continue;
        // Skip heavily-played (already discovered)
        if ((playCounts[g] || 0) > 2) continue;
        const tags = (typeof getT === 'function') ? getT(g) : [];
        let score = 0;
        tags.forEach(t => { score += (tagHistory[t] || 0); });
        if (score > 0) scores[g] = score;
    }
    return Object.keys(scores)
        .sort((a, b) => scores[b] - scores[a])
        .slice(0, count);
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.favorites && Array.isArray(data.favorites)) {
                    favorites = data.favorites;
                    Storage.setJSON('arcade_favorites', favorites);
                }
                if (data.recentlyPlayed && Array.isArray(data.recentlyPlayed)) {
                    recentlyPlayed = data.recentlyPlayed;
                    Storage.setJSON('arcade_recent', recentlyPlayed);
                }
                if (data.playCounts) {
                    Object.keys(data.playCounts).forEach(k => {
                        if (k === '__konami__') return;  // skip internal
                        playCounts[k] = (playCounts[k] || 0) + (data.playCounts[k] || 0);
                    });
                    Storage.setJSON(Storage.KEYS.plays, playCounts);
                }
                alert('✅ Import successful! ' + (data.favorites ? data.favorites.length : 0) + ' favorites restored.');
                if (typeof displayGames === 'function') displayGames();
            } catch (err) {
                alert('❌ Import failed: ' + err.message);
            }
        };
        reader.onerror = () => alert('❌ File read failed');
        reader.readAsText(file);
    };
    input.click();
}

// ---------- 6. ACHIEVEMENTS ----------
const ACHIEVEMENTS = {
    firstSteps:    { name: 'First Steps',    desc: 'Play any game',                        icon: '🎮' },
    speedDemon:    { name: 'Speed Demon',    desc: 'Score a reaction test under 200ms',    icon: '⚡' },
    marathon:      { name: 'Marathon',       desc: 'Play 50 different games',              icon: '🏃' },
    clickerKing:   { name: 'Clicker King',   desc: 'Hit 100+ clicks in one Click Frenzy',  icon: '🖱️' },
    perfectMemory: { name: 'Perfect Memory', desc: 'Reach round 5 in Memory Match',        icon: '🧠' },
    konamiMaster:  { name: 'Konami Master',  desc: 'Play all 9 secret minigames',          icon: '👑' },
};

function getAchievementEarned() {
    return (Storage.getJSON(Storage.KEYS.achievements, []) || []).filter(id => !!ACHIEVEMENTS[id]);
}

function getSkillStats() {
    const stats = { bestReaction: 9999, clickerKing: false, perfectMemory: false, minis: {} };
    try {
        const r = parseInt(localStorage.getItem('arcade_best_reaction') || '9999', 10);
        stats.bestReaction = isNaN(r) ? 9999 : r;
        stats.clickerKing = localStorage.getItem('arcade_clicker_king') === '1';
        stats.perfectMemory = localStorage.getItem('arcade_perfect_memory') === '1';
        const m = JSON.parse(localStorage.getItem('arcade_minigames') || '{}');
        if (m && typeof m === 'object') stats.minis = m;
    } catch (e) {}
    return stats;
}

function checkAchievements() {
    const earned = getAchievementEarned();
    const newOnes = [];
    const tryEarn = (id) => {
        if (earned.indexOf(id) === -1) {
            earned.push(id);
            newOnes.push(ACHIEVEMENTS[id]);
        }
    };
    const skill = getSkillStats();
    const distinct = Object.keys(playCounts).filter(k => k.indexOf('__') !== 0).length;
    if (totalPlays >= 1) tryEarn('firstSteps');
    if (skill.bestReaction < 200) tryEarn('speedDemon');
    if (distinct >= 50) tryEarn('marathon');
    if (skill.clickerKing) tryEarn('clickerKing');
    if (skill.perfectMemory) tryEarn('perfectMemory');
    const playedMinis = Object.keys(skill.minis).filter(k => skill.minis[k] > 0);
    if (playedMinis.length >= 9) tryEarn('konamiMaster');
    if (newOnes.length) {
        Storage.setJSON(Storage.KEYS.achievements, earned);
        newOnes.forEach(showAchievementToast);
    }
}

function showAchievementToast(ach) {
    if (!ach) return;
    const toast = document.createElement('div');
    toast.className = 'achievement-toast';
    toast.innerHTML = '<div class="ach-icon">' + ach.icon + '</div>' +
                      '<div><b>' + ach.name + '</b><br><small>' + ach.desc + '</small></div>';
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('show'));
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 500);
    }, 4000);
}

function showAchievements() {
    const earned = getAchievementEarned();
    const all = Object.keys(ACHIEVEMENTS);
    const lines = all.map(id => {
        const a = ACHIEVEMENTS[id];
        const got = earned.indexOf(id) !== -1;
        return (got ? '✅' : '⬜') + ' ' + a.icon + '  ' + a.name + ' — ' + a.desc;
    });
    const favCount = (typeof favorites !== 'undefined') ? favorites.length : 0;
    alert('🏆 ACHIEVEMENTS (' + earned.length + '/' + all.length + ')\n\n' + lines.join('\n') +
          '\n\n📊 PLAYS: ' + totalPlays + '  |  ❤️ FAVORITES: ' + favCount);
}

const KONAMI_PATTERN = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
let konamiBuffer = [];
function konamiCheck(key) {
    konamiBuffer.push(key);
    if (konamiBuffer.length > KONAMI_PATTERN.length) konamiBuffer.shift();
    if (konamiBuffer.join(',') === KONAMI_PATTERN.join(',')) {
        konamiBuffer = [];
        activateKonami();
    }
}
function activateKonami() {
    playKonamiChord();
    let style = document.getElementById('konami-style');
    if (!style) {
        style = document.createElement('style');
        style.id = 'konami-style';
        style.textContent = '@keyframes arcade-rainbow { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }';
        document.head.appendChild(style);
    }
    document.body.style.animation = 'arcade-rainbow 3s linear infinite';
    playCounts['__konami__'] = 1;
    alert('🎮 KONAMI CODE ACTIVATED!\n\n↑↑↓↓←→←→BA\n\n30 LIVES GRANTED!\nRainbow mode for 30 seconds.');
    setTimeout(() => {
        document.body.style.animation = '';
    }, 30000);
}

// Retro 8-bit chord blast when the Konami code is entered (Feature #10)
function playKonamiChord() {
    try {
        initAudio();
        if (!audioCtx || isMasterMuted()) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
        freqs.forEach((f, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = f;
            const t0 = now + i * 0.07;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
            osc.connect(gain);
            gain.connect(masterGain || audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + 0.55);
        });
    } catch (e) {}
}

// ---------- 8. KEYBOARD SHORTCUTS (single listener) ----------
document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key;
    konamiCheck(k);
    if (k === '/') {
        e.preventDefault();
        const s = document.getElementById('search-input');
        if (s) s.focus();
    } else if (k === 'r' || k === 'R') {
        if (typeof rollDice === 'function') rollDice();
    } else if (k === 'm' || k === 'M') {
        if (typeof toggleAmbientMusic === 'function') toggleAmbientMusic();
    } else if (k === 'f' || k === 'F') {
        const fav = document.querySelector('.favorites-tab');
        if (fav) fav.click();
    } else if (k === 'Escape') {
        const s = document.getElementById('search-input');
        if (s) { s.value = ''; if (typeof displayGames === 'function') displayGames(); }
    }
});

function launchGame(g) {
    if (!g) return;
    const ext = (typeof SHELF_HTM_GAMES !== 'undefined' && SHELF_HTM_GAMES.has(g)) ? '.htm' : '.html';
    const overlay = document.getElementById('launcher-overlay');
    if (overlay) {
        const nm = document.getElementById('launcher-name');
        const btn = document.getElementById('launcher-play');
        if (nm) {
            let n = g.replace(/([0-9\.]+)/g, ' $1 ').replace(/([A-Z])/g, ' $1').replace(/_|-/g, ' ').replace(/\s+/g, ' ').trim();
            n = n.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            nm.textContent = n;
        }
        if (btn) btn.onclick = () => { openGame(g, ext); closeLauncher(); };
        overlay.style.display = 'flex';
    } else {
        openGame(g, ext);
    }
}

function openGame(g, ext) {
    try { window.open('./.boot-launch.html?g=' + encodeURIComponent(g + ext), '_blank'); } catch (e) {}
    if (typeof recordRecent === 'function') recordRecent(g);
    if (typeof recordPlay === 'function') recordPlay(g);
    // Playtime tracking
    const key = 'arcade_playtime_' + g;
    const start = Date.now();
    const prev = parseInt(localStorage.getItem(key) || '0', 10);
    const interval = setInterval(() => {
      const elapsed = prev + Math.floor((Date.now() - start) / 1000);
      localStorage.setItem(key, elapsed);
    }, 1000);
    window.addEventListener('beforeunload', () => clearInterval(interval), { once: true });
    playClickSound();
}

function closeLauncher() {
    const overlay = document.getElementById('launcher-overlay');
    if (overlay) overlay.style.display = 'none';
}

window.addEventListener('load', () => {
    if (typeof showRecommendations === 'function') showRecommendations();
    if (typeof updateFavBadge === 'function') updateFavBadge();
});

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js').catch(() => {});
}

// Auto theme by time (6am-6pm lighter, 6pm-6am darker)
function autoThemeSchedule() {
  const hour = new Date().getHours();
  const isDay = hour >= 6 && hour < 18;
  const saved = localStorage.getItem('arcade_theme');
  if (!saved || saved === 'auto') {
    document.documentElement.style.setProperty('--neon-green', isDay ? '#00cc66' : '#00ff88');
  }
}
autoThemeSchedule();
setInterval(autoThemeSchedule, 60000);

// Gamepad detection
function updateGamepadStatus() {
  const gps = navigator.getGamepads();
  const connected = Array.from(gps).filter(g => g);
  const badge = document.getElementById('gamepad-badge');
  if (badge) {
    badge.textContent = connected.length ? `🎮 ${connected.length} controller${connected.length>1?'s':''} connected` : '';
    badge.style.display = connected.length ? 'inline' : 'none';
  }
}
setInterval(updateGamepadStatus, 1000);
window.addEventListener('gamepadconnected', updateGamepadStatus);
window.addEventListener('gamepaddisconnected', updateGamepadStatus);

  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});

}
