<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Python Terminal - Arcade Hub</title>
<style>
    * { box-sizing: border-box; }
    body {
        background: #050508;
        color: #00ff88;
        font-family: 'Courier New', monospace;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .header {
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(0, 255, 136, 0.05);
        border: 1px solid #00ff88;
        border-radius: 4px;
    }
    .header h1 {
        margin: 0;
        font-size: 1.3rem;
        color: #00ff88;
        text-shadow: 0 0 10px #00ff88;
    }
    .back-btn {
        background: rgba(0, 255, 136, 0.1);
        color: #00ff88;
        border: 1px solid #00ff88;
        padding: 8px 16px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.9rem;
        text-decoration: none;
        transition: all 0.2s;
    }
    .back-btn:hover {
        background: rgba(0, 255, 136, 0.3);
        box-shadow: 0 0 10px #00ff88;
    }
    .terminal {
        width: 100%;
        max-width: 1200px;
        background: rgba(0, 0, 0, 0.85);
        border: 2px solid #00ff88;
        border-radius: 4px;
        padding: 20px;
        min-height: 500px;
        max-height: 60vh;
        overflow-y: auto;
        box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }
    .output-line { margin: 2px 0; white-space: pre-wrap; word-wrap: break-word; }
    .prompt-line { color: #00ccff; }
    .err-line { color: #ff4444; }
    .ok-line { color: #00ff88; }
    .info-line { color: #ffcc00; }
    .input-line {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        max-width: 1200px;
        margin-top: -2px;
    }
    .input-line .input-prompt { color: #00ccff; }
    .input-line input {
        background: transparent;
        border: none;
        color: #00ff88;
        font-family: inherit;
        font-size: 0.95rem;
        flex: 1;
        outline: none;
        caret-color: #00ff88;
    }
    .controls {
        width: 100%;
        max-width: 1200px;
        margin-top: 15px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .btn {
        background: rgba(0, 255, 136, 0.1);
        color: #00ff88;
        border: 1px solid #00ff88;
        padding: 8px 16px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        transition: all 0.2s;
    }
    .btn:hover {
        background: rgba(0, 255, 136, 0.3);
        box-shadow: 0 0 10px #00ff88;
    }
    .btn.danger {
        border-color: #ff4444;
        color: #ff4444;
    }
    .btn.danger:hover {
        background: rgba(255, 68, 68, 0.2);
        box-shadow: 0 0 10px #ff4444;
    }
    .examples {
        width: 100%;
        max-width: 1200px;
        margin-top: 15px;
        padding: 15px;
        background: rgba(0, 204, 255, 0.05);
        border: 1px solid #00ccff;
        border-radius: 4px;
    }
    .examples h3 {
        margin: 0 0 10px 0;
        color: #00ccff;
        font-size: 0.95rem;
    }
    .examples button {
        background: rgba(0, 204, 255, 0.1);
        color: #00ccff;
        border: 1px solid #00ccff;
        padding: 6px 12px;
        margin: 3px;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.8rem;
        transition: all 0.2s;
    }
    .examples button:hover {
        background: rgba(0, 204, 255, 0.3);
    }
    .loader {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
        min-height: 400px;
    }
    .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(0, 255, 136, 0.2);
        border-top-color: #00ff88;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
        text-align: center;
        color: #00ff88;
        font-size: 0.9rem;
    }
</style>
</head>
<body>
    <div class="header">
        <h1>PYTHON TERMINAL</h1>
        <a class="back-btn" href="../PRESSHERETOSTART.html">BACK</a>
    </div>

    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div class="status" id="status">LOADING PYTHON RUNTIME...</div>
        <div class="status" style="color: #00ff88; font-size: 0.75rem; max-width: 600px; text-align: center;">
            Works on Windows, Mac, Linux, and Chromebook - no special launch needed
        </div>
    </div>

    <div id="terminal" class="terminal" style="display:none;"></div>
    <div id="input-row" class="input-line" style="display:none;">
        <span class="input-prompt">&gt;&gt;&gt;</span>
        <input type="text" id="cmd-input" autocomplete="off" autofocus />
    </div>

    <div class="controls" id="controls" style="display:none;">
        <button class="btn" id="btn-clear">Clear</button>
        <button class="btn" id="btn-save">Save Script</button>
        <button class="btn" id="btn-load">Load Script</button>
        <button class="btn" id="btn-list">List Scripts</button>
        <button class="btn danger" id="btn-reset">Reset Runtime</button>
    </div>

    <div class="examples" id="examples" style="display:none;">
        <h3>QUICK EXAMPLES</h3>
        <button data-ex="hello">print hello</button>
        <button data-ex="math">math.pi, sqrt(2)</button>
        <button data-ex="loop">for loop</button>
        <button data-ex="list">list comprehension</button>
        <button data-ex="fib">fibonacci(15)</button>
        <button data-ex="ascii">ascii art</button>
        <button data-ex="maze">maze generator</button>
    </div>

<script type="module">
    // ===== ELEMENTS =====
    const loader = document.getElementById('loader');
    const statusEl = document.getElementById('status');
    const terminal = document.getElementById('terminal');
    const inputRow = document.getElementById('input-row');
    const cmdInput = document.getElementById('cmd-input');
    const controls = document.getElementById('controls');
    const examples = document.getElementById('examples');

    // ===== STATE =====
    let pyodide = null;
    let commandHistory = [];
    let historyIndex = -1;

    // ===== UI HELPERS =====
    function appendOutput(text, cls) {
        const div = document.createElement('div');
        div.className = 'output-line ' + (cls || '');
        div.textContent = text;
        terminal.appendChild(div);
        terminal.scrollTop = terminal.scrollHeight;
    }

    function showPrompt() {
        cmdInput.disabled = false;
        cmdInput.value = '';
        cmdInput.focus();
    }

    function hidePrompt() {
        cmdInput.disabled = true;
    }

    function showTerminal() {
        loader.style.display = 'none';
        terminal.style.display = 'block';
        inputRow.style.display = 'flex';
        controls.style.display = 'flex';
        examples.style.display = 'block';
        appendOutput('==============================================================', 'ok-line');
        appendOutput('       PYTHON 3.11 IN YOUR BROWSER (via Pyodide)', 'ok-line');
        appendOutput('       Works on file:// URLs without any browser flags', 'ok-line');
        appendOutput('==============================================================', 'ok-line');
        appendOutput('');
        appendOutput('Type Python code and press Enter. Examples below.', 'info-line');
        appendOutput('Use Up/Down arrows for command history.', 'info-line');
        appendOutput('');
        showPrompt();
    }

    function showError(msg) {
        statusEl.textContent = 'FAILED: ' + msg;
        statusEl.style.color = '#ff4444';
        // Show retry button
        const retryBtn = document.createElement('button');
        retryBtn.className = 'btn';
        retryBtn.textContent = 'Retry';
        retryBtn.onclick = () => location.reload();
        statusEl.appendChild(document.createElement('br'));
        statusEl.appendChild(retryBtn);
    }

    // ===== PYODIDE LOAD =====
    async function loadPyodideRuntime() {
        try {
            statusEl.textContent = 'Loading pyodide.js...';
            // Load pyodide.js (UMD) as a regular script tag
            // This works on file:// URLs when the browser is launched with --allow-file-access-from-files
            // (which the LAUNCH ARCADE.bat does)
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = './pyodide/pyodide.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Failed to load pyodide.js (check browser console)'));
                document.head.appendChild(script);
            });

            if (typeof window.loadPyodide !== 'function') {
                throw new Error('loadPyodide not found after script load. Was the script blocked?');
            }

            statusEl.textContent = 'Initializing Python (first load may take a few seconds)...';
            const baseHref = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const indexURL = baseHref + 'pyodide/';
            pyodide = await window.loadPyodide({ indexURL: indexURL });

            // Set up stdout/stderr capture
            pyodide.setStdout({ batched: (s) => appendOutput(s, '') });
            pyodide.setStderr({ batched: (s) => appendOutput(s, 'err-line') });
            showTerminal();
        } catch (err) {
            // Common cause: Chrome blocks .asm.js and .wasm fetches on file:// URLs
            // The LAUNCH ARCADE.bat opens Chrome with --allow-file-access-from-files
            const msg = (err && err.message) || String(err);
            let helpText = 'FAILED: ' + msg;
            if (msg.includes('Failed to fetch') || msg.includes('CORS') || msg.includes('net::') || msg.includes('cross-origin')) {
                helpText += ' | Chrome blocks .wasm/.asm.js fetches on file:// URLs. Use LAUNCH ARCADE.bat in the project root to open this page with the required browser flags.';
            }
            showError(helpText);
        }
    }

    // ===== RUN CODE =====
    async function runCode(code) {
        try {
            // Capture stdout from the runPython call too
            const result = await pyodide.runPythonAsync(code);
            if (result !== undefined && result !== null && result !== '') {
                appendOutput(String(result), 'ok-line');
            }
        } catch (err) {
            appendOutput('Error: ' + err.message, 'err-line');
        }
        showPrompt();
    }

    // ===== INPUT =====
    cmdInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            const code = cmdInput.value;
            if (code.trim() === '') { showPrompt(); return; }
            commandHistory.push(code);
            historyIndex = commandHistory.length;
            appendOutput('>>> ' + code, 'prompt-line');
            hidePrompt();
            runCode(code);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (historyIndex > 0) {
                historyIndex--;
                cmdInput.value = commandHistory[historyIndex];
            }
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (historyIndex < commandHistory.length - 1) {
                historyIndex++;
                cmdInput.value = commandHistory[historyIndex];
            } else {
                historyIndex = commandHistory.length;
                cmdInput.value = '';
            }
        }
    });

    // ===== CONTROLS =====
    document.getElementById('btn-clear').addEventListener('click', () => {
        terminal.innerHTML = '';
        appendOutput('Terminal cleared.', 'info-line');
        showPrompt();
    });

    document.getElementById('btn-save').addEventListener('click', () => {
        const name = prompt('Save as filename:', 'myscript.py');
        if (!name) { showPrompt(); return; }
        const code = commandHistory.join('\n');
        try {
            const scripts = JSON.parse(localStorage.getItem('arcade_python_scripts') || '{}');
            scripts[name] = code;
            localStorage.setItem('arcade_python_scripts', JSON.stringify(scripts));
            appendOutput('Saved: ' + name + ' (' + code.length + ' chars)', 'ok-line');
        } catch (e) {
            appendOutput('Save failed: ' + e.message, 'err-line');
        }
        showPrompt();
    });

    document.getElementById('btn-load').addEventListener('click', () => {
        const name = prompt('Load filename:');
        if (!name) { showPrompt(); return; }
        try {
            const scripts = JSON.parse(localStorage.getItem('arcade_python_scripts') || '{}');
            if (scripts[name]) {
                commandHistory = scripts[name].split('\n');
                appendOutput('Loaded: ' + name + ' (' + commandHistory.length + ' lines)', 'ok-line');
                appendOutput('Use Up arrow to recall commands, Enter to run.', 'info-line');
            } else {
                appendOutput('Not found: ' + name, 'err-line');
            }
        } catch (e) {
            appendOutput('Load failed: ' + e.message, 'err-line');
        }
        showPrompt();
    });

    document.getElementById('btn-list').addEventListener('click', () => {
        try {
            const scripts = JSON.parse(localStorage.getItem('arcade_python_scripts') || '{}');
            const names = Object.keys(scripts);
            if (names.length === 0) {
                appendOutput('No saved scripts.', 'info-line');
            } else {
                appendOutput('Saved scripts:', 'info-line');
                for (const i in names) {
                    appendOutput('  - ' + names[i], '');
                }
            }
        } catch (e) {
            appendOutput('List failed: ' + e.message, 'err-line');
        }
        showPrompt();
    });

    document.getElementById('btn-reset').addEventListener('click', async () => {
        appendOutput('Resetting Python runtime...', 'info-line');
        hidePrompt();
        try {
            pyodide.runPython('import sys; sys.modules.clear()');
            // Re-init globals
            pyodide.runPython('print("Runtime reset.")');
        } catch (e) {
            appendOutput('Reset failed: ' + e.message, 'err-line');
        }
        showPrompt();
    });

    // ===== EXAMPLES =====
    const EXAMPLES = {
        hello: 'print("Hello, World!")',
        math: 'import math\nprint(f"pi = {math.pi}")\nprint(f"sqrt(2) = {math.sqrt(2)}")',
        loop: 'for i in range(5):\n    print(f"Count: {i}")',
        list: 'squares = [x**2 for x in range(10)]\nprint(squares)',
        fib: 'def fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a\nprint([fib(i) for i in range(15)])',
        ascii: 'for i in range(1, 8):\n    print(" " * (8 - i) + "*" * (2 * i - 1))',
        maze: 'for r in range(8):\n    line = ""\n    for c in range(20):\n        line += "#" if (r * 7 + c * 13) % 3 == 0 else " "\n    print(line)'
    };

    document.querySelectorAll('button[data-ex]').forEach(btn => {
        btn.addEventListener('click', function() {
            const name = this.getAttribute('data-ex');
            const code = EXAMPLES[name];
            if (!code) return;
            commandHistory.push(code);
            historyIndex = commandHistory.length;
            appendOutput('>>> ' + code, 'prompt-line');
            hidePrompt();
            runCode(code);
        });
    });

    // ===== KEEP FOCUS =====
    document.addEventListener('click', (e) => {
        const tag = e.target.tagName;
        if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT') return;
        if (!cmdInput.disabled) cmdInput.focus();
    });

    // ===== GLOBAL SHORTCUTS =====
    const konamiBuffer = [];
    const konamiCode = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];

    document.addEventListener('keydown', (e) => {
        const k = e.key;
        const kLow = k.toLowerCase();
        const inInput = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';

        if (!inInput || k === 'ArrowUp' || k === 'ArrowDown') {
            if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' || kLow === 'b' || kLow === 'a') {
                konamiBuffer.push(k);
                if (konamiBuffer.length > 10) konamiBuffer.shift();
                if (konamiBuffer.join(',') === konamiCode.join(',')) {
                    window.location.href = './.konami.html';
                }
            }
        }

        if ((e.ctrlKey || e.metaKey) && e.shiftKey && kLow === 'a') {
            e.preventDefault();
            window.location.href = './.secrets.html';
        }
        if (k === '?' && !inInput) {
            window.location.href = './.shortcuts.html';
        }
        if (k === 'Escape') {
            window.location.href = '../PRESSHERETOSTART.html';
        }
    });

    // ===== CLICK TRACKER =====
    document.addEventListener('click', () => {
        const count = parseInt(localStorage.getItem('arcade_total_clicks') || '0', 10) + 1;
        localStorage.setItem('arcade_total_clicks', String(count));
    }, true);

    // ===== START =====
    statusEl.textContent = 'Loading Pyodide (ESM module)...';
    loadPyodideRuntime();
</script>
</body>
</html>
