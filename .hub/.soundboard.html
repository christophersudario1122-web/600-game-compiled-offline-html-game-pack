<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#00ff88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Soundboard - Arcade Hub</title>
<style>
:root {
--neon-green: #00ff88;
--dark-bg: #050508;
--box-bg: rgba(10, 10, 15, 0.85);
--border: #00ff88;
--accent: #00ccff;
--warn: #ffcc00;
--danger: #ff4d4d;
}
body {
background: var(--dark-bg);
color: var(--neon-green);
font-family: 'Courier New', monospace;
margin: 0;
padding: 20px;
min-height: 100vh;
}
#matrix-canvas {
position: fixed;
top: 0; left: 0;
width: 100%; height: 100%;
z-index: 0;
opacity: 0.12;
pointer-events: none;
}
.container {
position: relative;
z-index: 2;
max-width: 1100px;
margin: 0 auto;
}
.header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 25px;
padding-bottom: 15px;
border-bottom: 2px solid var(--border);
}
h1 {
margin: 0;
font-size: 1.8rem;
text-shadow: 0 0 10px var(--neon-green);
}
.btn {
background: rgba(0, 255, 136, 0.1);
color: var(--neon-green);
border: 2px solid var(--neon-green);
padding: 8px 16px;
font-family: monospace;
font-weight: 700;
cursor: pointer;
border-radius: 4px;
transition: 0.2s;
margin-left: 8px;
}
.btn:hover {
background: var(--neon-green);
color: var(--dark-bg);
box-shadow: 0 0 15px var(--neon-green);
}
.section {
background: var(--box-bg);
border: 1px solid var(--border);
border-radius: 6px;
padding: 20px;
margin-bottom: 20px;
}
.section h2 {
margin: 0 0 15px;
font-size: 1.2rem;
color: var(--accent);
text-shadow: 0 0 5px var(--accent);
}
.sound-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
gap: 12px;
}
.sound-btn {
background: rgba(0, 255, 136, 0.08);
border: 1px solid var(--border);
color: var(--neon-green);
padding: 16px 12px;
font-family: monospace;
font-size: 0.85rem;
border-radius: 4px;
cursor: pointer;
transition: all 0.15s;
text-align: center;
min-height: 70px;
display: flex;
flex-direction: column;
justify-content: center;
gap: 4px;
}
.sound-btn:hover {
background: rgba(0, 255, 136, 0.25);
box-shadow: 0 0 12px var(--neon-green);
transform: translateY(-2px);
}
.sound-btn:active {
background: var(--neon-green);
color: var(--dark-bg);
transform: translateY(0);
box-shadow: 0 0 20px var(--neon-green);
}
.sound-btn.playing {
background: var(--neon-green);
color: var(--dark-bg);
box-shadow: 0 0 25px var(--neon-green);
animation: pulse 0.15s ease-out;
}
@keyframes pulse {
0% { transform: scale(1); }
50% { transform: scale(1.05); }
100% { transform: scale(1); }
}
.sound-btn .label { font-weight: 700; }
.sound-btn .desc { font-size: 0.7rem; color: var(--accent); opacity: 0.8; }
.sound-btn .key-hint { font-size: 0.65rem; color: #888; margin-top: 2px; }
kbd { background: rgba(0, 255, 136, 0.15); border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; font-family: monospace; font-size: 0.75em; }
.category-tag { display: inline-block; font-size: 0.65rem; padding: 2px 6px; border-radius: 3px; margin-bottom: 4px; font-weight: 700; }
.cat-ui { background: rgba(0, 204, 255, 0.2); border: 1px solid var(--accent); color: var(--accent); }
.cat-hacker { background: rgba(0, 255, 136, 0.2); border: 1px solid var(--neon-green); color: var(--neon-green); }
.cat-synth { background: rgba(255, 204, 0, 0.2); border: 1px solid var(--warn); color: var(--warn); }
.cat-game { background: rgba(255, 77, 77, 0.2); border: 1px solid var(--danger); color: var(--danger); }
.cat-meme { background: rgba(255, 0, 255, 0.2); border: 1px solid #ff00ff; color: #ff00ff; }
.cat-cod { background: rgba(255, 140, 0, 0.2); border: 1px solid #ff8c00; color: #ff8c00; }
.controls-row {
display: flex;
gap: 10px;
margin-bottom: 20px;
flex-wrap: wrap;
align-items: center;
}
.volume-control {
display: flex;
align-items: center;
gap: 10px;
margin-left: auto;
}
.volume-control label { font-size: 0.85rem; }
.volume-control input[type=range] { width: 120px; }
.info-bar {
background: rgba(0, 204, 255, 0.1);
border: 1px solid var(--accent);
border-radius: 4px;
padding: 12px;
margin-bottom: 20px;
font-size: 0.85rem;
}
.info-bar kbd { background: var(--accent); color: var(--dark-bg); }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="container">
<div class="header">
<h1>🔊 SOUNDBOARD</h1>
<div>
<button class="btn" onclick="window.location='../.hub/.library1.html'">← Library</button>
<button class="btn" onclick="window.location='../PRESSHERETOSTART.html'">⌂ Home</button>
<span id="gamepad-badge" style="display:none;background:rgba(0,255,136,0.15);border:1px solid #00ff88;padding:4px 10px;border-radius:4px;font-family:monospace;font-size:0.8rem;color:#00ff88;margin:0 8px;"></span>
</div>
</div>

<div class="info-bar">
Click any button to play a sound. <kbd>Space</kbd> stops all. <kbd>1-9</kbd> quick-play first row.
<span style="float:right">Master Volume: <span id="vol-label">100%</span></span>
</div>

<div class="controls-row">
<button class="btn" id="stop-all" onclick="stopAllSounds(); playClickSound()">⏹ STOP ALL</button>
<button class="btn" id="test-all" onclick="testAllSounds(); playClickSound()">▶ TEST ROW</button>
<div class="volume-control">
<label>Volume:</label>
<input type="range" id="master-volume" min="0" max="100" value="100" oninput="setMasterVolume(this.value)">
<span id="vol-display">100%</span>
</div>
</div>

<!-- UI SOUNDS -->
<div class="section">
<h2>🖱️ UI SOUNDS</h2>
<div class="sound-grid" id="ui-sounds"></div>
</div>

<!-- HACKER SOUNDS -->
<div class="section">
<h2>💻 HACKER SOUNDS</h2>
<div class="sound-grid" id="hacker-sounds"></div>
</div>

<!-- SYNTH SOUNDS -->
<div class="section">
<h2>🎹 SYNTH SOUNDS</h2>
<div class="sound-grid" id="synth-sounds"></div>
</div>

<!-- GAME SOUNDS -->
<div class="section">
<h2>🎮 GAME SOUNDS</h2>
<div class="sound-grid" id="game-sounds"></div>
</div>

<!-- MEME SOUNDS -->
<div class="section">
<h2>😂 MEME SOUNDS</h2>
<div class="sound-grid" id="meme-sounds"></div>
</div>

<!-- COD SOUNDS -->
<div class="section">
<h2>🔫 COD / FPS SOUNDS</h2>
<div class="sound-grid" id="cod-sounds"></div>
</div>

</div>

<script>
// =====================================================
// MATRIX RAIN BACKGROUND
// =====================================================
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let mw, mh;
function resize() { mw = canvas.width = innerWidth; mh = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const droys = [], chars = '01アイウエオカキクケコサシスセソ';
let matrixBrightness = 1.0;
function initDroys() { droys.length = 0; for (let i = 0; i < Math.floor(mw/14); i++) droys[i] = Math.random()*mh; }
initDroys();
addEventListener('resize', initDroys);

const MATRIX_BRIGHTNESS_KEY = 'arcade_matrix_brightness';
function getMatrixBrightness() {
try { const v = parseInt(localStorage.getItem(MATRIX_BRIGHTNESS_KEY) || '100', 10); return (isNaN(v)) ? 1.0 : Math.max(0, Math.min(100, v)) / 100; } catch (e) { return 1.0; }
}
function applyMatrixBrightness() { matrixBrightness = getMatrixBrightness(); }
applyMatrixBrightness();
window.addEventListener('storage', (e) => { if (e.key === MATRIX_BRIGHTNESS_KEY || e.key === null) applyMatrixBrightness(); });

setInterval(() => {
ctx.globalAlpha = matrixBrightness;
ctx.fillStyle = 'rgba(5,5,8,0.05)';
ctx.fillRect(0, 0, mw, mh);
ctx.fillStyle = '#00ff88';
ctx.font = '14px monospace';
for (let i = 0; i < droys.length; i++) {
ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, droys[i]);
if (droys[i] > mh && Math.random() > 0.975) droys[i] = 0;
droys[i] += 14;
}
}, 50);

// =====================================================
// AUDIO SYSTEM (shared with library1)
// =====================================================
let audioCtx = null;
let masterGain = null;
let masterVolume = 1.0;
let activeOscillators = [];

function isMasterMuted() {
try { return window._masterMuted === true || localStorage.getItem('arcade_master_mute') === 'on'; } catch (e) { return false; }
}

function updateMasterGain() {
try { if (audioCtx && masterGain) masterGain.gain.setValueAtTime(isMasterMuted() ? 0 : masterVolume, audioCtx.currentTime); } catch (e) {}
}

function initAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
masterGain = audioCtx.createGain();
masterGain.gain.setValueAtTime(isMasterMuted() ? 0 : masterVolume, audioCtx.currentTime);
masterGain.connect(audioCtx.destination);
}
if (audioCtx.state === 'suspended') audioCtx.resume();
}

function setMasterVolume(val) {
masterVolume = val / 100;
document.getElementById('vol-display').textContent = val + '%';
document.getElementById('vol-label').textContent = val + '%';
updateMasterGain();
}

function playSound(type, freq, duration, when, params) {
try {
initAudio();
if (!audioCtx || isMasterMuted()) return;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = type || 'sine';
osc.frequency.value = freq || 440;
gain.gain.setValueAtTime(0.1 * masterVolume, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (duration || 0.2));
osc.connect(gain);
gain.connect(masterGain);
const startTime = when || audioCtx.currentTime;
osc.start(startTime);
osc.stop(startTime + (duration || 0.2));
activeOscillators.push(osc);
osc.onended = () => { const idx = activeOscillators.indexOf(osc); if (idx > -1) activeOscillators.splice(idx, 1); };
if (params) {
if (params.freqEnd !== undefined) osc.frequency.exponentialRampToValueAtTime(params.freqEnd, audioCtx.currentTime + (duration || 0.2));
if (params.volume !== undefined) gain.gain.setValueAtTime(params.volume * masterVolume, audioCtx.currentTime);
}
return osc;
} catch (e) { console.error(e); }
}

function playClickSound() { playSound('square', 800, 0.05); }
function playHoverSound() { playSound('sine', 1200, 0.03); }
function stopAllSounds() {
try {
activeOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
activeOscillators = [];
} catch(e) {}
}

// Sound definitions
const sounds = {
ui: [
{key:1, label:'Click', desc:'Standard click', fn:()=>playSound('square',800,0.05), kh:'1'},
{key:2, label:'Hover', desc:'Button hover', fn:()=>playSound('sine',1200,0.03), kh:'2'},
{key:3, label:'Select', desc:'Menu select', fn:()=>playSound('sine',600,0.08), kh:'3'},
{key:4, label:'Cancel', desc:'Go back', fn:()=>playSound('square',400,0.06), kh:'4'},
{key:5, label:'Success', desc:'Task complete', fn:()=>playSound('sine',[800,1200],0.3), kh:'5'},
{key:6, label:'Error', desc:'Operation failed', fn:()=>playSound('sawtooth',200,0.3), kh:'6'},
{key:7, label:'Notification', desc:'Alert ping', fn:()=>playSound('triangle',1000,0.1), kh:'7'},
{key:8, label:'Typewriter', desc:'Key press', fn:()=>playSound('square',1500,0.02), kh:'8'},
{key:9, label:'Pop', desc:'Quick pop', fn:()=>playSound('sine',1400,0.04), kh:'9'},
],
hacker: [
{key:1, label:'Beep', desc:'System beep', fn:()=>playSound('sine',1000,0.1), kh:'q'},
{key:2, label:'Boot', desc:'System startup', fn:()=>playSound('sawtooth',200,0.5,{freqEnd:800}), kh:'w'},
{key:3, label:'Scan', desc:'Port scan', fn:()=>playSound('square',500,0.05,{freqEnd:2000}), kh:'e'},
{key:4, label:'Access', desc:'Access granted', fn:()=>playSound('sine',[600,900,1200],0.4), kh:'r'},
{key:5, label:'Denied', desc:'Access denied', fn:()=>playSound('sawtooth',100,0.5), kh:'t'},
{key:6, label:'Process', desc:'Processing...', fn:()=>playSound('triangle',400,0.1,{freqEnd:800}), kh:'y'},
{key:7, label:'Complete', desc:'Process done', fn:()=>playSound('sine',[800,1000,1200,1600],0.5), kh:'u'},
{key:8, label:'Glitch', desc:'Data corruption', fn:()=>playSound('square',800,0.03,{freqEnd:100}), kh:'i'},
{key:9, label:'Shutdown', desc:'System halt', fn:()=>playSound('sawtooth',800,0.6,{freqEnd:50}), kh:'o'},
],
synth: [
{key:1, label:'Sine', desc:'Pure tone', fn:()=>playSound('sine',440,0.5), kh:'a'},
{key:2, label:'Square', desc:'8-bit tone', fn:()=>playSound('square',440,0.5), kh:'s'},
{key:3, label:'Saw', desc:'Buzzy tone', fn:()=>playSound('sawtooth',440,0.5), kh:'d'},
{key:4, label:'Triangle', desc:'Soft tone', fn:()=>playSound('triangle',440,0.5), kh:'f'},
{key:5, label:'Chord', desc:'Major triad', fn:()=>{playSound('sine',440,0.5);playSound('sine',554,0.5);playSound('sine',659,0.5);}, kh:'g'},
{key:6, label:'Arpeggio', desc:'Broken chord', fn:()=>{setTimeout(()=>playSound('sine',440,0.3),0);setTimeout(()=>playSound('sine',554,0.3),150);setTimeout(()=>playSound('sine',659,0.3),300);}, kh:'h'},
{key:7, label:'Bass', desc:'Low freq', fn:()=>playSound('sawtooth',110,0.8), kh:'j'},
{key:8, label:'Lead', desc:'High lead', fn:()=>playSound('square',880,0.4), kh:'k'},
{key:9, label:'Pad', desc:'Ambient', fn:()=>{playSound('sine',220,1);playSound('sine',330,1);playSound('sine',440,1);}, kh:'l'},
],
game: [
{key:1, label:'Coin', desc:'Mario coin', fn:()=>playSound('sine',[880,1320],0.2), kh:'z'},
{key:2, label:'Jump', desc:'Jump sound', fn:()=>playSound('sine',400,0.1,{freqEnd:800}), kh:'x'},
{key:3, label:'Powerup', desc:'Power up', fn:()=>playSound('sine',[523,659,784,1047],0.4), kh:'c'},
{key:4, label:'Hit', desc:'Damage taken', fn:()=>playSound('square',200,0.2), kh:'v'},
{key:5, label:'1-Up', desc:'Extra life', fn:()=>playSound('sine',[659,880,1047,1318],0.6), kh:'b'},
{key:6, label:'Warp', desc:'Teleport', fn:()=>playSound('sawtooth',600,0.3,{freqEnd:200}), kh:'n'},
{key:7, label:'Boss', desc:'Boss appear', fn:()=>playSound('sawtooth',100,0.8), kh:'m'},
{key:8, label:'Win', desc:'Victory fanfare', fn:()=>{playSound('sine',659,0.2);setTimeout(()=>playSound('sine',880,0.2),200);setTimeout(()=>playSound('sine',1047,0.2),400);setTimeout(()=>playSound('sine',1318,0.5),600);}, kh:','},
{key:9, label:'Game Over', desc:'Defeat', fn:()=>playSound('sawtooth',440,0.3,{freqEnd:110}), kh:'.'},
],
meme: [
{key:1, label:'Bruh', desc:'Bruh moment', fn:()=>playSound('sawtooth',200,0.4), kh:'1'},
{key:2, label:'Oof', desc:'Roblox death', fn:()=>playSound('sine',300,0.3), kh:'2'},
{key:3, label:'Vine Boom', desc:'Vine sound', fn:()=>playSound('sawtooth',100,0.5), kh:'3'},
{key:4, label:'Windows XP', desc:'Startup sound', fn:()=>{playSound('sine',800,0.1);playSound('sine',1200,0.1);playSound('sine',1600,0.1);}, kh:'4'},
{key:5, label:'Tada', desc:'Ta-da!', fn:()=>playSound('sine',[880,1320,1760],0.4), kh:'5'},
{key:6, label:'Ding', desc:'Notification', fn:()=>playSound('triangle',1500,0.1), kh:'6'},
{key:7, label:'Wrong', desc:'Wrong answer', fn:()=>playSound('square',150,0.3), kh:'7'},
{key:8, label:'Magic', desc:'Magic spell', fn:()=>{playSound('sine',800,0.1);playSound('sine',1200,0.1);playSound('sine',1600,0.1);}, kh:'8'},
{key:9, label:'Burp', desc:'Random burp', fn:()=>playSound('sawtooth',80,0.2), kh:'9'},
],
cod: [
{key:1, label:'Headshot', desc:'Headshot sound', fn:()=>playSound('sine',1500,0.05), kh:'1'},
{key:2, label:'Kill', desc:'Kill confirmed', fn:()=>{playSound('sine',800,0.1);setTimeout(()=>playSound('sine',1200,0.1),100);}, kh:'2'},
{key:3, label:'Reload', desc:'Weapon reload', fn:()=>playSound('sawtooth',200,0.3), kh:'3'},
{key:4, label:'Grenade', desc:'Explosion', fn:()=>playSound('sawtooth',50,1), kh:'4'},
{key:5, label:'Defuse', desc:'Bomb defuse', fn:()=>playSound('sine',1000,0.05,{freqEnd:2000}), kh:'5'},
{key:6, label:'Plant', desc:'Bomb plant', fn:()=>playSound('square',800,0.2), kh:'6'},
{key:7, label:'Ace', desc:'Ace round', fn:()=>{playSound('sine',659,0.2);setTimeout(()=>playSound('sine',880,0.2),150);setTimeout(()=>playSound('sine',1047,0.2),300);setTimeout(()=>playSound('sine',1318,0.2),450);setTimeout(()=>playSound('sine',1760,0.5),600);}, kh:'7'},
{key:8, label:'Flash', desc:'Flashbang', fn:()=>playSound('sawtooth',2000,0.5), kh:'8'},
{key:9, label:'Defuse Kit', desc:'Kit sound', fn:()=>playSound('square',600,0.15), kh:'9'},
]
};

// Render sounds
function renderSounds() {
Object.entries(sounds).forEach(([cat, list]) => {
const container = document.getElementById(cat + '-sounds');
if (!container) return;
list.forEach(s => {
const btn = document.createElement('button');
btn.className = 'sound-btn cat-' + cat;
btn.onclick = () => { s.fn(); playClickSound(); btn.classList.add('playing'); setTimeout(()=>btn.classList.remove('playing'), 150); };
btn.innerHTML = `<span class="label">${s.label}</span><span class="desc">${s.desc}</span><span class="key-hint">[${s.kh}]</span>`;
container.appendChild(btn);
});
});
}
renderSounds();

// Keyboard shortcuts
addEventListener('keydown', (e) => {
if (e.code === 'Space') { e.preventDefault(); stopAllSounds(); playClickSound(); }
const key = e.key;
Object.values(sounds).flat().forEach(s => { if (s.kh === key) { s.fn(); playClickSound(); } });
});

// Test all
function testAllSounds() {
Object.values(sounds).flat().forEach((s, i) => {
setTimeout(() => { s.fn(); }, i * 80);
});
}

// Init
document.addEventListener('DOMContentLoaded', () => { initAudio(); });
</script>
<script src="./shared-features.js"></script>
</body>
</html>
