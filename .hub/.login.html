<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="../.manifest.json">
<meta name="theme-color" content="#00ff88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Secure Login Client</title>
<style>
    :root {
        --neon-green: #00ff88;
        --dark-bg: #050508;
        --box-bg: rgba(10, 10, 15, 0.85);
    }

    body {
        background: var(--dark-bg);
        color: var(--neon-green);
        font-family: 'Courier New', Courier, monospace;
        padding: 30px;
        margin: 0;
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #matrix-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.25;
        pointer-events: none;
    }

    .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 10;
        pointer-events: none;
    }

    .login-box {
        position: relative;
        z-index: 2;
        background: var(--box-bg);
        border: 2px solid var(--neon-green);
        padding: 35px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 0 30px rgba(0,255,136,0.15), inset 0 0 15px rgba(0,255,136,0.05);
        backdrop-filter: blur(8px);
        width: 350px;
        box-sizing: border-box;
    }

    h2 {
        font-size: 1.8rem;
        letter-spacing: 2px;
        margin-bottom: 15px;
        text-shadow: 0 0 10px rgba(0,255,136,0.5);
    }

    p {
        opacity: 0.75;
        font-size: 0.95rem;
        margin-bottom: 20px;
        letter-spacing: 1px;
    }

    input {
        background: rgba(0, 255, 136, 0.05);
        border: 2px solid var(--neon-green);
        color: var(--neon-green);
        padding: 12px;
        width: 100%;
        margin-bottom: 20px;
        font-family: monospace;
        font-size: 1rem;
        text-align: center;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
        box-shadow: inset 0 0 10px rgba(0,255,136,0.05);
    }

    input:focus {
        box-shadow: 0 0 15px rgba(0,255,136,0.3), inset 0 0 10px rgba(0,255,136,0.1);
    }

    button {
        background: rgba(0, 255, 136, 0.05);
        border: 2px solid var(--neon-green);
        color: var(--neon-green);
        padding: 12px 25px;
        font-size: 1.05rem;
        font-family: monospace;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        width: 100%;
        transition: 0.25s;
        box-shadow: 0 0 10px rgba(0,255,136,0.1);
    }

    button:hover {
        background: var(--neon-green);
        color: var(--dark-bg);
        box-shadow: 0 0 25px var(--neon-green);
        transform: scale(1.02);
    }

    .error {
        color: #ff3333;
        margin-top: 15px;
        font-size: 0.9rem;
        text-shadow: 0 0 8px rgba(255,51,51,0.4);
    }
</style>
</head>
<body>

<div class="crt-overlay"></div>
<canvas id="matrix-canvas"></canvas>

<div class="login-box">
    <h2>[ SECURE LOGIN ]</h2>
    <p>> ENTER ACCESS KEY:</p>
    <input type="password" id="password-input" placeholder="Password..." autofocus>
    <button onclick="checkPassword(); playClickSound();" onmouseenter="playHoverSound()">AUTHORIZE</button>
    <div id="error-msg" class="error"></div>
    <button onclick="window.location='./.soundboard.html'" class="btn" style="margin-top: 10px; font-size: 0.8rem; padding: 6px 12px;">🎵 Soundboard</button>
            <span id="gamepad-badge" style="display:none;background:rgba(0,255,136,0.15);border:1px solid #00ff88;padding:4px 10px;border-radius:4px;font-family:monospace;font-size:0.8rem;color:#00ff88;margin:0 8px;"></span>
</div>

<script>
// THEME SYNC (cross-page)
try {
    const t = JSON.parse(localStorage.getItem('arcade_custom_theme') || 'null');
    const r = document.documentElement.style;
    if (t && t.color) {
        r.setProperty('--neon-green', t.color);
        if (t.bg) r.setProperty('--dark-bg', t.bg);
        if (t.accent) r.setProperty('--accent', t.accent);
    } else {
        const c = localStorage.getItem('arcade_custom_color');
        if (c) r.setProperty('--neon-green', c);
    }
} catch (e) {}

// --- AUDIO SYSTEM ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playHoverSound() {
    try {
        initAudio();
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    } catch(e) {}
}

function playClickSound() {
    try {
        initAudio();
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

// --- PASSWORD CHECK ---
function checkPassword() {
    const pass = document.getElementById('password-input').value;
    
    if (pass === "Chrsiischeeks") {
        window.location.href = "./.boot-launch.html?g=tisrealyaint.html";
    } else {
        document.getElementById('error-msg').innerText = "> ACCESS DENIED: INVALid KEY";
    }
}

document.getElementById('password-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkPassword();
        playClickSound();
    }
});

// --- MATRIX RAIN ---
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const alphabet = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array.from({length: columns}, () => 1);
let matrixBrightness = 1.0; // 0-1, controls letter opacity

function drawMatrix() {
    ctx.fillStyle = '#050508';
    ctx.globalAlpha = 0.08;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1.0;
    
    ctx.globalAlpha = matrixBrightness;
    ctx.fillStyle = '#00ff88';
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
// =====================================================
// BACKGROUND INTENSITY (Feature #11)
// localStorage 'arcade_bg_intensity' (0-100, default 100)
// =====================================================
const BG_INTENSITY_KEY = 'arcade_bg_intensity';
const BASE_MATRIX_MS = 30;
let matrixTimer = null;
const crtOverlay = document.querySelector('.crt-overlay');

function getBgIntensity() {
    try {
        const v = parseInt(localStorage.getItem(BG_INTENSITY_KEY) || '100', 10);
        return (isNaN(v)) ? 100 : Math.max(0, Math.min(100, v));
    } catch (e) { return 100; }
}

function applyBgIntensity() {
    const level = getBgIntensity();
    canvas.style.opacity = String(0.25 * level / 100);
    if (crtOverlay) crtOverlay.style.opacity = String(level / 100);
    if (matrixTimer) { clearInterval(matrixTimer); matrixTimer = null; }
    if (level > 0) {
        const ms = Math.max(30, Math.round(BASE_MATRIX_MS * 100 / level));
        matrixTimer = setInterval(drawMatrix, ms);
    }
}

applyBgIntensity();
window.addEventListener('storage', (e) => {
    if (e.key === BG_INTENSITY_KEY || e.key === null) applyBgIntensity();
    if (e.key === MATRIX_BRIGHTNESS_KEY || e.key === null) applyMatrixBrightness();
});

// =====================================================
// MATRIX BRIGHTNESS (New feature)
// localStorage 'arcade_matrix_brightness' (0-100, default 100)
// Controls letter opacity independently of background intensity
// =====================================================
const MATRIX_BRIGHTNESS_KEY = 'arcade_matrix_brightness';

function getMatrixBrightness() {
    try {
        const v = parseInt(localStorage.getItem(MATRIX_BRIGHTNESS_KEY) || '100', 10);
        return (isNaN(v)) ? 1.0 : Math.max(0, Math.min(100, v)) / 100;
    } catch (e) { return 1.0; }
}

function applyMatrixBrightness() {
    matrixBrightness = getMatrixBrightness();
}

// Apply initial brightness
applyMatrixBrightness();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
<script src="./.shared-features.js"></script>
<script src="./.arcade-features.js"></script>
<script src="./.boot-transition.js"></script>
<script src="./.motion.js"></script>
</body>
</html>
